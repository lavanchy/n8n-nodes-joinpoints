name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned instead of 'lts/*': a transitive dependency (isolated-vm, via
          # n8n-workflow -> @n8n/expression-runtime) fails to compile its native
          # addon against newer Node majors (e.g. 26) until it catches up with
          # V8 API changes. Node 22 is confirmed working.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'
